# ZMK Configuration for Corne Keyboard

# =============================================================================
# POWER MANAGEMENT & SLEEP
# =============================================================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# =============================================================================
# BATTERY & REPORTING
# =============================================================================
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# =============================================================================
# SPLIT KEYBOARD SETTINGS
# =============================================================================
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# =============================================================================
# INPUT & SCANNING
# =============================================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# =============================================================================
# POINTING DEVICE (removed to save memory)
# =============================================================================
# CONFIG_ZMK_POINTING=y

# =============================================================================
# USB CONFIGURATION
# =============================================================================
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# =============================================================================
# BLUETOOTH SETTINGS
# =============================================================================
# Disable 2M PHY for better Windows compatibility
CONFIG_BT_CTLR_PHY_2M=n

# Increase transmit power for better range/stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Conservative connection parameters for stability
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Experimental Bluetooth settings for stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# =============================================================================
# MEMORY OPTIMIZATION (optimized for ZMK Studio)
# =============================================================================
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=12288
CONFIG_BT_RX_STACK_SIZE=2048

# =============================================================================
# DEBUG (enable minimal logging for crash debugging)
# =============================================================================
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_ERR=y
