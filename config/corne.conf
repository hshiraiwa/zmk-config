# ZMK Configuration for Corne Keyboard

# =============================================================================
# POWER MANAGEMENT & SLEEP
# =============================================================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# =============================================================================
# BATTERY & REPORTING
# =============================================================================
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# =============================================================================
# SPLIT KEYBOARD SETTINGS
# =============================================================================
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# =============================================================================
# INPUT & SCANNING
# =============================================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# =============================================================================
# POINTING DEVICE
# =============================================================================
CONFIG_ZMK_POINTING=y

# =============================================================================
# USB CONFIGURATION
# =============================================================================
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# =============================================================================
# BLUETOOTH SETTINGS
# =============================================================================
# Disable 2M PHY for better Windows compatibility
CONFIG_BT_CTLR_PHY_2M=n

# Increase transmit power for better range/stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection parameters for cross-platform compatibility
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Experimental Bluetooth settings for stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# =============================================================================
# MEMORY OPTIMIZATION
# =============================================================================
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# =============================================================================
# DEBUG (enable for troubleshooting)
# =============================================================================
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
